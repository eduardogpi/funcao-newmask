<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo - myMaskAll</title>
</head>
<body>
    <h2>Exemplos com myMaskAll</h2>
    <label>CPF: <input class="mask-cpf" type="text" /></label><br><br>
    <label>Data: <input class="mask-data" type="text" /></label><br><br>
    <label>Telefone: <input class="mask-tel" type="text" /></label>

    <script src="input.js"></script>
    <script>
        myMaskAll('.mask-cpf',  { mask: '999.999.999-99' });
        myMaskAll('.mask-data', { mask: '99/99/9999' });
        myMaskAll('.mask-tel',  { mask: '(99) 99999-9999' });
    </script>
</body>
</html>
